[package]
name = "internet-speed-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A COSMIC desktop applet for live internet speed and data usage"
license = "GPL-3.0-or-later"
repository = "https://github.com/AceMythos/cosmic-internet-speed-monitor"
readme = "README.md"
keywords = ["cosmic", "applet", "network", "bandwidth"]
categories = ["desktop", "network-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "20dfd7c236208930634881ec52d22e7a353206dd"
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "tokio",
    "wayland",
    "winit",
]
